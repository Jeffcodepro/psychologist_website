version: "3.8"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: psychologist_production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - source: postgres_admin_password
        target: postgres_admin_password
      - source: db_password
        target: db_password
    configs:
      - source: init_database
        target: /docker-entrypoint-initdb.d/10-application.sh
        mode: 0555
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      backend:
        aliases: [psychologist_postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d psychologist_production"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == banco-de-dados-manager02
      restart_policy: { condition: on-failure, delay: 5s }
      update_config: { parallelism: 1, order: stop-first }
      resources:
        reservations: { cpus: "0.10", memory: 128M }
        limits: { cpus: "1.00", memory: 1G }

networks:
  backend:
    external: true
    name: psychologist_backend
volumes:
  postgres_data:
    external: true
    name: psychologist_postgres_data
secrets:
  postgres_admin_password:
    external: true
    name: psychologist_postgres_admin_password_v1
  db_password:
    external: true
    name: psychologist_db_password_v1
configs:
  init_database:
    external: true
    name: psychologist_db_init_v1
